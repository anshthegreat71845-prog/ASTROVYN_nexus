<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#02040b">

<meta name="description"
content="ASTROVYN — Ansh Srivastava's personal portfolio exploring science, AI, space and technology.">

<title>ASTROVYN — Ansh Srivastava</title>

<style>

/* =====================================================
   ROOT
===================================================== */

:root{
  --bg:#02040b;
  --bg2:#050816;
  --card:rgba(8,14,32,.72);

  --text:#f7f9ff;
  --muted:#9da8c5;

  --cyan:#62e8ff;
  --purple:#9d7cff;
  --pink:#ff72d2;

  --line:rgba(120,150,255,.18);

  --glow:
    0 0 45px rgba(98,232,255,.15);
}


/* =====================================================
   RESET
===================================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  scroll-behavior:smooth;
}

html{
  background:var(--bg);
}

body{
  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(98,232,255,.09),
      transparent 30%
    ),

    radial-gradient(
      circle at 85% 20%,
      rgba(157,124,255,.11),
      transparent 32%
    ),

    linear-gradient(
      180deg,
      #02040b,
      #050816 50%,
      #02030a
    );

  color:var(--text);

  overflow-x:hidden;
}


/* =====================================================
   INTRO SCREEN
===================================================== */

#intro{
  position:fixed;

  inset:0;

  z-index:99999;

  display:flex;

  justify-content:center;

  align-items:center;

  flex-direction:column;

  background:
    radial-gradient(
      circle at center,
      rgba(98,232,255,.10),
      transparent 35%
    ),
    #02040b;

  animation:
    introDisappear 1.2s ease 6s forwards;

  pointer-events:none;

  overflow:hidden;
}


/* INTRO GRID */

#intro::before{

  content:"";

  position:absolute;

  inset:-100%;

  background:
    linear-gradient(
      rgba(98,232,255,.025) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(98,232,255,.025) 1px,
      transparent 1px
    );

  background-size:70px 70px;

  transform:
    perspective(500px)
    rotateX(60deg);

  animation:gridMove 10s linear infinite;
}

@keyframes gridMove{

  from{
    transform:
      perspective(500px)
      rotateX(60deg)
      translateY(0);
  }

  to{
    transform:
      perspective(500px)
      rotateX(60deg)
      translateY(140px);
  }
}


/* INTRO RING */

.intro-ring{

  position:absolute;

  width:380px;
  height:380px;

  border:
    1px solid
    rgba(98,232,255,.2);

  border-radius:50%;

  animation:
    introRotate 8s linear infinite;

  box-shadow:
    0 0 80px rgba(98,232,255,.06);
}

.intro-ring::before{

  content:"";

  position:absolute;

  width:15px;
  height:15px;

  background:var(--cyan);

  border-radius:50%;

  top:15px;
  left:50%;

  box-shadow:
    0 0 30px var(--cyan);
}

.intro-ring::after{

  content:"";

  position:absolute;

  width:10px;
  height:10px;

  background:var(--purple);

  border-radius:50%;

  right:30px;
  bottom:55px;

  box-shadow:
    0 0 25px var(--purple);
}


@keyframes introRotate{

  to{
    transform:rotate(360deg);
  }
}


/* INTRO TEXT */

.intro-small{

  color:var(--cyan);

  font-size:12px;

  letter-spacing:7px;

  text-transform:uppercase;

  margin-bottom:35px;

  opacity:0;

  animation:
    introText .8s ease .4s forwards;
}


.hello{

  min-height:1.2em;

  font-size:
    clamp(
      55px,
      10vw,
      125px
    );

  font-weight:900;

  letter-spacing:-6px;

  text-align:center;

  background:
    linear-gradient(
      90deg,
      #ffffff,
      var(--cyan),
      var(--purple),
      var(--pink),
      #ffffff
    );

  background-size:400% auto;

  -webkit-background-clip:text;

  background-clip:text;

  color:transparent;

  animation:
    helloGradient 4s linear infinite,
    helloPulse 1.5s ease-in-out infinite alternate;
}


.hello-sub{

  margin-top:30px;

  color:#8e9bb9;

  font-size:14px;

  letter-spacing:5px;

  opacity:0;

  animation:
    introText .8s ease 1s forwards;
}


@keyframes introText{

  from{
    opacity:0;
    transform:
      translateY(30px)
      scale(.95);
  }

  to{
    opacity:1;
    transform:
      translateY(0)
      scale(1);
  }
}


@keyframes helloGradient{

  to{
    background-position:
      400% center;
  }
}


@keyframes helloPulse{

  from{
    transform:scale(1);

    filter:
      drop-shadow(
        0 0 10px
        rgba(98,232,255,.2)
      );
  }

  to{
    transform:scale(1.04);

    filter:
      drop-shadow(
        0 0 40px
        rgba(98,232,255,.5)
      );
  }
}


@keyframes introDisappear{

  to{
    opacity:0;
    visibility:hidden;
  }
}


/* =====================================================
   STAR FIELD
===================================================== */

#stars,
#stars2,
#stars3{

  position:fixed;

  inset:0;

  z-index:-5;

  pointer-events:none;

  background-repeat:repeat;
}


#stars{

  background-image:

    radial-gradient(
      1px 1px at 20px 30px,
      #fff,
      transparent
    ),

    radial-gradient(
      1px 1px at 80px 120px,
      #8eeeff,
      transparent
    ),

    radial-gradient(
      1px 1px at 180px 70px,
      #fff,
      transparent
    ),

    radial-gradient(
      1px 1px at 300px 160px,
      #9d7cff,
      transparent
    ),

    radial-gradient(
      1px 1px at 420px 40px,
      #fff,
      transparent
    ),

    radial-gradient(
      1px 1px at 470px 190px,
      #62e8ff,
      transparent
    );

  background-size:
    500px 220px;

  opacity:.7;

  animation:
    starsMove 35s linear infinite;
}


#stars2{

  background-image:

    radial-gradient(
      1.5px 1.5px at 50px 100px,
      #fff,
      transparent
    ),

    radial-gradient(
      1px 1px at 250px 190px,
      #62e8ff,
      transparent
    ),

    radial-gradient(
      1px 1px at 500px 60px,
      #fff,
      transparent
    ),

    radial-gradient(
      1px 1px at 700px 140px,
      #9d7cff,
      transparent
    );

  background-size:
    800px 300px;

  opacity:.4;

  animation:
    starsMove 55s linear infinite reverse;
}


#stars3{

  background-image:

    radial-gradient(
      2px 2px at 120px 40px,
      #62e8ff,
      transparent
    ),

    radial-gradient(
      1px 1px at 600px 210px,
      #fff,
      transparent
    ),

    radial-gradient(
      1px 1px at 900px 100px,
      #ff72d2,
      transparent
    );

  background-size:
    1000px 350px;

  opacity:.3;

  animation:
    starsMove 80s linear infinite;
}


@keyframes starsMove{

  from{
    transform:
      translateY(0);
  }

  to{
    transform:
      translateY(700px);
  }
}


/* =====================================================
   FLOATING PARTICLES
===================================================== */

.particles{

  position:fixed;

  inset:0;

  z-index:-2;

  pointer-events:none;

  overflow:hidden;
}


.particle{

  position:absolute;

  width:4px;
  height:4px;

  border-radius:50%;

  background:var(--cyan);

  box-shadow:
    0 0 18px var(--cyan);

  animation:
    particleFloat linear infinite;
}


.particle:nth-child(1){
  left:5%;
  animation-duration:12s;
}

.particle:nth-child(2){
  left:15%;
  animation-duration:17s;
}

.particle:nth-child(3){
  left:28%;
  animation-duration:14s;
}

.particle:nth-child(4){
  left:42%;
  animation-duration:19s;
}

.particle:nth-child(5){
  left:58%;
  animation-duration:13s;
}

.particle:nth-child(6){
  left:72%;
  animation-duration:18s;
}

.particle:nth-child(7){
  left:86%;
  animation-duration:15s;
}

.particle:nth-child(8){
  left:95%;
  animation-duration:21s;
}


@keyframes particleFloat{

  from{
    transform:
      translateY(110vh)
      scale(.4);

    opacity:0;
  }

  25%{
    opacity:.8;
  }

  70%{
    opacity:.9;
  }

  to{
    transform:
      translateY(-10vh)
      translateX(100px)
      scale(1.4);

    opacity:0;
  }
}


/* =====================================================
   NAVIGATION
===================================================== */

nav{

  position:fixed;

  top:0;
  left:0;

  width:100%;

  z-index:1000;

  padding:
    20px 7%;

  display:flex;

  align-items:center;

  justify-content:space-between;

  background:
    rgba(3,5,13,.68);

  backdrop-filter:
    blur(20px);

  border-bottom:
    1px solid
    rgba(255,255,255,.07);

  transition:.4s;
}


.logo{

  display:flex;

  align-items:center;

  gap:12px;

  color:#fff;

  text-decoration:none;

  font-weight:800;

  letter-spacing:4px;

  font-size:21px;
}


.logo img{

  width:46px;
  height:46px;

  object-fit:contain;

  border-radius:50%;

  animation:
    logoFloat 4s ease-in-out infinite;
}


@keyframes logoFloat{

  0%,100%{
    transform:
      translateY(0)
      rotate(0);
  }

  50%{
    transform:
      translateY(-5px)
      rotate(6deg);
  }
}


.logo-dot{

  width:8px;
  height:8px;

  background:var(--cyan);

  border-radius:50%;

  box-shadow:
    0 0 18px var(--cyan);

  animation:
    dotPulse 1.5s infinite;
}


@keyframes dotPulse{

  50%{
    transform:scale(1.8);
    opacity:.4;
  }
}


nav ul{

  list-style:none;

  display:flex;

  gap:35px;
}


nav ul a{

  color:#c7cee2;

  text-decoration:none;

  font-size:13px;

  letter-spacing:1.5px;

  transition:.3s;

  position:relative;
}


nav ul a::after{

  content:"";

  position:absolute;

  left:0;

  bottom:-8px;

  width:0;

  height:1px;

  background:var(--cyan);

  box-shadow:
    0 0 12px var(--cyan);

  transition:.3s;
}


nav ul a:hover{

  color:var(--cyan);
}


nav ul a:hover::after{

  width:100%;
}


.menu{

  display:none;

  font-size:28px;

  cursor:pointer;
}


/* =====================================================
   FULL SCREEN HERO SLIDE
===================================================== */

.hero{

  min-height:110vh;

  padding:
    160px 8%
    100px;

  display:grid;

  grid-template-columns:
    1.15fr .85fr;

  gap:80px;

  align-items:center;

  position:relative;
}


.hero::before{

  content:"";

  position:absolute;

  width:750px;
  height:750px;

  border-radius:50%;

  background:
    rgba(98,232,255,.07);

  filter:blur(140px);

  left:-300px;

  top:80px;

  z-index:-1;

  animation:
    giantGlow 8s ease-in-out infinite alternate;
}


.hero::after{

  content:"";

  position:absolute;

  width:600px;
  height:600px;

  border-radius:50%;

  background:
    rgba(157,124,255,.08);

  filter:blur(130px);

  right:-250px;

  bottom:-100px;

  z-index:-1;

  animation:
    giantGlow 10s ease-in-out infinite alternate-reverse;
}


@keyframes giantGlow{

  from{
    transform:scale(.7);
    opacity:.35;
  }

  to{
    transform:scale(1.3);
    opacity:1;
  }
}


/* HERO TEXT */

.eyebrow{

  color:var(--cyan);

  font-size:13px;

  letter-spacing:5px;

  text-transform:uppercase;

  margin-bottom:30px;

  animation:
    slideFromLeft 1s ease .3s both;
}


@keyframes slideFromLeft{

  from{
    opacity:0;
    transform:
      translateX(-50px);
  }

  to{
    opacity:1;
    transform:
      translateX(0);
  }
}


.hero h1{

  font-size:
    clamp(
      65px,
      10vw,
      145px
    );

  line-height:.88;

  letter-spacing:-7px;

  margin-bottom:35px;

  animation:
    titleReveal 1.2s
    cubic-bezier(.2,.8,.2,1)
    .5s both;
}


@keyframes titleReveal{

  from{
    opacity:0;

    transform:
      translateY(80px)
      scale(.9);

    filter:
      blur(15px);
  }

  to{
    opacity:1;

    transform:
      translateY(0)
      scale(1);

    filter:
      blur(0);
  }
}


.hero h1 span{

  display:block;

  background:
    linear-gradient(
      90deg,
      #fff,
      var(--cyan),
      var(--purple),
      var(--pink),
      #fff
    );

  background-size:
    300% auto;

  -webkit-background-clip:text;

  background-clip:text;

  color:transparent;

  animation:
    textGradient 5s linear infinite;
}


@keyframes textGradient{

  to{
    background-position:
      300% center;
  }
}


.hero p{

  color:var(--muted);

  font-size:20px;

  line-height:1.9;

  max-width:720px;

  animation:
    fadeUp 1s ease .9s both;
}


@keyframes fadeUp{

  from{
    opacity:0;

    transform:
      translateY(35px);
  }

  to{
    opacity:1;

    transform:
      translateY(0);
  }
}


/* BUTTONS */

.hero-buttons{

  display:flex;

  gap:18px;

  margin-top:42px;

  flex-wrap:wrap;

  animation:
    fadeUp 1s ease 1.1s both;
}


.btn{

  text-decoration:none;

  color:white;

  padding:
    16px 27px;

  border-radius:35px;

  border:
    1px solid
    var(--line);

  background:
    rgba(255,255,255,.04);

  transition:.4s;

  font-size:14px;

  position:relative;

  overflow:hidden;
}


.btn::before{

  content:"";

  position:absolute;

  top:0;
  left:-130%;

  width:100%;
  height:100%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.3),
      transparent
    );

  transition:.7s;
}


.btn:hover::before{

  left:130%;
}


.btn.primary{

  background:
    linear-gradient(
      100deg,
      #42dff8,
      #8b70ff
    );

  border:0;

  color:#02030a;

  font-weight:bold;

  box-shadow:
    0 0 30px
    rgba(98,232,255,.2);

  animation:
    buttonPulse 2.5s infinite;
}


@keyframes buttonPulse{

  50%{
    box-shadow:
      0 0 55px
      rgba(98,232,255,.35);
  }
}


.btn:hover{

  transform:
    translateY(-6px)
    scale(1.03);

  box-shadow:
    0 15px 45px
    rgba(98,232,255,.16);
}


/* =====================================================
   LARGE SPACE VISUAL
===================================================== */

.space-visual{

  height:620px;

  display:grid;

  place-items:center;

  position:relative;

  animation:
    visualFloat 7s ease-in-out infinite;
}


@keyframes visualFloat{

  0%,100%{
    transform:
      translateY(0);
  }

  50%{
    transform:
      translateY(-20px);
  }
}


.orbit{

  position:absolute;

  border-radius:50%;

  border:
    1px solid
    rgba(98,232,255,.22);

  animation:
    spin 18s linear infinite;
}


.orbit.one{

  width:390px;
  height:390px;
}


.orbit.two{

  width:510px;
  height:220px;

  border-color:
    rgba(157,124,255,.25);

  transform:
    rotate(-25deg);

  animation-duration:
    25s;
}


.orbit.three{

  width:570px;
  height:570px;

  border-color:
    rgba(255,114,210,.12);

  animation-duration:
    35s;
}


@keyframes spin{

  from{
    transform:rotate(0);
  }

  to{
    transform:rotate(360deg);
  }
}


.planet{

  width:165px;
  height:165px;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 30% 25%,
      #c8f9ff,
      #3175b8 32%,
      #15195b 70%,
      #050616
    );

  box-shadow:

    0 0 50px
    rgba(98,232,255,.4),

    0 0 130px
    rgba(98,232,255,.13),

    inset
    -20px -20px 35px
    rgba(0,0,0,.65);

  position:relative;

  animation:
    planetPulse 4s ease-in-out infinite;
}


@keyframes planetPulse{

  50%{

    box-shadow:

      0 0 75px
      rgba(98,232,255,.6),

      0 0 150px
      rgba(98,232,255,.2),

      inset
      -20px -20px 35px
      rgba(0,0,0,.65);
  }
}


.planet::after{

  content:"";

  position:absolute;

  width:255px;
  height:65px;

  border:
    2px solid
    rgba(157,124,255,.65);

  border-radius:50%;

  left:-45px;

  top:50px;

  transform:
    rotate(-15deg);

  box-shadow:
    0 0 35px
    rgba(157,124,255,.25);

  animation:
    ringGlow 3s infinite;
}


@keyframes ringGlow{

  50%{

    border-color:
      rgba(98,232,255,.9);

    box-shadow:
      0 0 50px
      rgba(98,232,255,.35);
  }
}


.moon{

  position:absolute;

  width:23px;
  height:23px;

  background:#dce7ff;

  border-radius:50%;

  top:20px;

  right:30px;

  box-shadow:
    0 0 20px white;

  animation:
    moonMove 5s linear infinite;
}


@keyframes moonMove{

  from{
    transform:
      rotate(0)
      translateX(12px)
      rotate(0);
  }

  to{
    transform:
      rotate(360deg)
      translateX(12px)
      rotate(-360deg);
  }
}


/* =====================================================
   FULL SCREEN SECTIONS
===================================================== */

section{

  min-height:100vh;

  padding:
    130px 8%;

  position:relative;

  display:flex;

  flex-direction:column;

  justify-content:center;
}


/* SECTION HEAD */

.section-label{

  color:var(--cyan);

  text-transform:uppercase;

  letter-spacing:5px;

  font-size:12px;

  margin-bottom:20px;
}


.section-title{

  font-size:
    clamp(
      45px,
      6vw,
      85px
    );

  line-height:.98;

  margin-bottom:35px;

  letter-spacing:-4px;
}


.section-description{

  max-width:850px;

  color:var(--muted);

  line-height:1.9;

  font-size:18px;
}


/* =====================================================
   ABOUT
===================================================== */

.about-grid{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:30px;

  margin-top:65px;
}


.card{

  border:
    1px solid
    var(--line);

  background:
    linear-gradient(
      145deg,
      rgba(14,22,45,.82),
      rgba(5,9,22,.7)
    );

  border-radius:25px;

  padding:38px;

  box-shadow:
    var(--glow);

  transition:.45s;

  position:relative;

  overflow:hidden;
}


.card::before{

  content:"";

  position:absolute;

  width:200px;
  height:200px;

  border-radius:50%;

  background:
    rgba(98,232,255,.06);

  filter:blur(50px);

  top:-100px;
  right:-100px;

  transition:.6s;
}


.card:hover::before{

  transform:
    scale(2.5);
}


.card:hover{

  transform:
    translateY(-12px)
    scale(1.015);

  border-color:
    rgba(98,232,255,.45);

  box-shadow:

    0 25px 80px
    rgba(0,0,0,.35),

    0 0 40px
    rgba(98,232,255,.13);
}


.icon{

  width:55px;
  height:55px;

  display:grid;

  place-items:center;

  border-radius:15px;

  background:
    rgba(98,232,255,.08);

  border:
    1px solid
    rgba(98,232,255,.16);

  margin-bottom:25px;

  font-size:22px;

  transition:.4s;
}


.card:hover .icon{

  transform:
    rotate(10deg)
    scale(1.12);

  box-shadow:
    0 0 30px
    rgba(98,232,255,.18);
}


.card h3{

  margin-bottom:15px;

  font-size:23px;
}


.card p{

  color:var(--muted);

  line-height:1.85;

  font-size:15px;
}


/* =====================================================
   EXPLORE
===================================================== */

.interests{

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:20px;

  margin-top:60px;
}


.interest{

  min-height:240px;

  padding:32px 25px;
}


/* =====================================================
   TERMINAL
===================================================== */

.terminal{

  margin-top:60px;

  border:
    1px solid
    rgba(98,232,255,.2);

  background:#030711;

  border-radius:22px;

  overflow:hidden;

  box-shadow:
    0 30px 90px
    rgba(0,0,0,.4);

  transition:.4s;
}


.terminal:hover{

  transform:
    translateY(-8px);

  box-shadow:

    0 35px 100px
    rgba(0,0,0,.5),

    0 0 35px
    rgba(98,232,255,.08);
}


.terminal-top{

  display:flex;

  align-items:center;

  gap:9px;

  padding:17px 22px;

  border-bottom:
    1px solid
