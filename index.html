<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#020611">
<meta name="description" content="ASTROVYN — Space, Science, AI, Technology and Future Innovation.">
<title>ASTROVYN — Explore Beyond</title>

<style>
:root{
--bg:#020611;
--bg2:#050a18;
--panel:rgba(7,14,31,.72);
--line:rgba(104,189,255,.18);
--line2:rgba(118,231,255,.34);
--text:#f5f8ff;
--muted:#9ba9c7;
--cyan:#63e6ff;
--blue:#6b8cff;
--violet:#b277ff;
--green:#7dffc4;
--max:1180px;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html{
scroll-behavior:smooth;
}

body{
font-family:Inter,Arial,sans-serif;
color:var(--text);
background:
radial-gradient(circle at 20% 10%,rgba(65,108,255,.15),transparent 30%),
radial-gradient(circle at 80% 30%,rgba(0,220,255,.10),transparent 30%),
linear-gradient(180deg,#01040c,#030817 50%,#01040b);
overflow-x:hidden;
}

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
z-index:-2;
background-image:
radial-gradient(circle,rgba(255,255,255,.8) 0 1px,transparent 1.5px),
radial-gradient(circle,rgba(100,220,255,.55) 0 1px,transparent 1.5px);
background-size:120px 120px,190px 190px;
background-position:10px 20px,60px 80px;
opacity:.2;
animation:stars 30s linear infinite;
}

body:after{
content:"";
position:fixed;
inset:0;
pointer-events:none;
z-index:100;
background:linear-gradient(
transparent 50%,
rgba(100,220,255,.012) 50%
);
background-size:100% 5px;
opacity:.2;
}

@keyframes stars{
to{
background-position:250px 420px,-180px 300px;
}
}

a{
color:inherit;
text-decoration:none;
}

button{
font:inherit;
}

.container{
width:min(var(--max),calc(100% - 40px));
margin:auto;
}

section{
position:relative;
padding:120px 0;
overflow:hidden;
}

.section-number{
font:600 13px/1 "Space Grotesk",Arial,sans-serif;
letter-spacing:.42em;
color:var(--cyan);
margin-bottom:25px;
}

.section-title{
font:700 clamp(42px,7vw,82px)/.98 "Space Grotesk",Arial,sans-serif;
letter-spacing:-.055em;
max-width:850px;
}

.section-lead{
color:var(--muted);
font-size:clamp(17px,2vw,21px);
line-height:1.9;
max-width:800px;
margin-top:32px;
}

.glow{
position:absolute;
border-radius:50%;
filter:blur(70px);
pointer-events:none;
opacity:.3;
}

.glow.one{
width:360px;
height:360px;
background:#1757ff;
left:-180px;
top:15%;
}

.glow.two{
width:320px;
height:320px;
background:#00d8ff;
right:-160px;
bottom:10%;
}


/* =========================
INTRO
========================= */

.intro{
position:fixed;
inset:0;
z-index:9999;
display:grid;
place-items:center;
background:#01030a;
transition:opacity 1s ease,visibility 1s ease;
}

.intro.hide{
opacity:0;
visibility:hidden;
}

.intro-core{
text-align:center;
}

.hello{
height:120px;
display:flex;
align-items:center;
justify-content:center;
position:relative;
overflow:hidden;
font:800 clamp(44px,10vw,95px)/1 "Space Grotesk",Arial,sans-serif;
letter-spacing:-.05em;
}

.hello span{
position:absolute;
opacity:0;
transform:translateY(50px) scale(.85);
animation:helloIn 2.4s ease forwards;
}

.hello span:nth-child(1){animation-delay:0s}
.hello span:nth-child(2){animation-delay:.75s}
.hello span:nth-child(3){animation-delay:1.5s}
.hello span:nth-child(4){animation-delay:2.25s}
.hello span:nth-child(5){animation-delay:3s}
.hello span:nth-child(6){animation-delay:3.75s}

@keyframes helloIn{
0%{
opacity:0;
transform:translateY(50px) scale(.85);
filter:blur(10px);
}
25%,70%{
opacity:1;
transform:translateY(0) scale(1);
filter:blur(0);
}
100%{
opacity:0;
transform:translateY(-50px) scale(1.08);
filter:blur(10px);
}
}

.intro-line{
width:min(500px,80vw);
height:1px;
background:linear-gradient(90deg,transparent,var(--cyan),transparent);
margin:25px auto;
animation:lineGlow 2s ease-in-out infinite alternate;
}

@keyframes lineGlow{
from{opacity:.25}
to{opacity:1;box-shadow:0 0 25px var(--cyan)}
}

.intro-name{
font:700 14px "Space Grotesk",Arial,sans-serif;
letter-spacing:.55em;
color:var(--cyan);
}


/* =========================
NAVBAR
========================= */

.navbar{
position:fixed;
top:0;
left:0;
right:0;
z-index:500;
height:82px;
border-bottom:1px solid rgba(100,200,255,.12);
background:rgba(2,6,17,.72);
backdrop-filter:blur(18px);
}

.nav-inner{
height:100%;
display:flex;
align-items:center;
justify-content:space-between;
}

.brand{
display:flex;
align-items:center;
gap:12px;
font:800 25px "Space Grotesk",Arial,sans-serif;
letter-spacing:.08em;
}

.brand-logo{
width:42px;
height:42px;
border-radius:11px;
display:block;
filter:drop-shadow(0 0 12px rgba(99,230,255,.35));
transition:.3s;
}

.brand:hover .brand-logo{
transform:rotate(-5deg) scale(1.08);
filter:drop-shadow(0 0 22px rgba(99,230,255,.65));
}

.status-dot{
width:11px;
height:11px;
border-radius:50%;
background:var(--cyan);
box-shadow:0 0 15px var(--cyan);
animation:pulse 1.7s infinite;
}

@keyframes pulse{
50%{
transform:scale(1.5);
opacity:.45;
}
}

.nav-links{
display:flex;
gap:30px;
align-items:center;
}

.nav-links a{
font-size:12px;
font-weight:700;
letter-spacing:.18em;
color:#aab7d0;
transition:.25s;
position:relative;
}

.nav-links a:after{
content:"";
position:absolute;
left:0;
bottom:-10px;
width:0;
height:1px;
background:var(--cyan);
box-shadow:0 0 10px var(--cyan);
transition:.3s;
}

.nav-links a:hover{
color:var(--cyan);
}

.nav-links a:hover:after{
width:100%;
}

.menu{
display:none;
width:42px;
height:42px;
border:1px solid var(--line2);
background:transparent;
color:white;
font-size:26px;
cursor:pointer;
}


/* =========================
HERO
========================= */

.hero{
min-height:100vh;
padding-top:150px;
display:flex;
align-items:center;
}

.hero-grid{
display:grid;
grid-template-columns:1.05fr .95fr;
gap:50px;
align-items:center;
}

.hero-copy{
position:relative;
z-index:5;
}

.kicker{
display:flex;
align-items:center;
gap:12px;
font-size:13px;
font-weight:700;
letter-spacing:.4em;
color:var(--cyan);
margin-bottom:30px;
}

.kicker:before{
content:"✦";
font-size:20px;
}

.hero-title{
font:900 clamp(72px,12vw,170px)/.8 "Space Grotesk",Arial,sans-serif;
letter-spacing:-.08em;
margin-left:-7px;
}

.hero-title span{
display:block;
}

.hero-title .outline{
color:transparent;
-webkit-text-stroke:1px rgba(205,220,255,.75);
text-shadow:0 0 35px rgba(99,230,255,.08);
}

.hero-text{
font-size:18px;
line-height:1.8;
color:var(--muted);
max-width:680px;
margin-top:35px;
}

.hero-buttons{
display:flex;
gap:15px;
flex-wrap:wrap;
margin-top:35px;
}

.btn{
display:inline-flex;
align-items:center;
justify-content:center;
gap:10px;
padding:15px 22px;
border-radius:999px;
border:1px solid var(--line2);
font-size:12px;
font-weight:800;
letter-spacing:.15em;
transition:.3s;
}

.btn.primary{
background:linear-gradient(135deg,#4b6dff,#28dfff);
color:#00101b;
border:none;
box-shadow:0 0 30px rgba(74,160,255,.2);
}

.btn:hover{
transform:translateY(-4px);
box-shadow:0 12px 35px rgba(0,220,255,.18);
}

.hero-visual{
min-height:620px;
display:grid;
place-items:center;
position:relative;
transition:transform .2s ease;
}

.space{
width:500px;
height:500px;
position:relative;
}

.planet{
position:absolute;
width:180px;
height:180px;
border-radius:50%;
left:50%;
top:50%;
transform:translate(-50%,-50%);
background:
radial-gradient(circle at 65% 70%,#73f4ff 0 5%,#238dff 13%,#142a9b 40%,#040a21 75%);
box-shadow:
0 0 45px #145cff,
0 0 110px rgba(0,155,255,.45),
inset -30px -25px 55px #020616;
animation:planetFloat 5s ease-in-out infinite;
}

@keyframes planetFloat{
50%{
transform:translate(-50%,-54%);
}
}

.ring{
position:absolute;
width:370px;
height:110px;
border:1px solid rgba(99,230,255,.75);
border-radius:50%;
left:50%;
top:50%;
transform:translate(-50%,-50%) rotate(-5deg);
box-shadow:0 0 15px rgba(99,230,255,.25);
animation:ringRotate 8s linear infinite;
}

@keyframes ringRotate{
to{
transform:translate(-50%,-50%) rotate(355deg);
}
}

.orbit{
position:absolute;
border:1px solid rgba(99,230,255,.18);
border-radius:50%;
left:50%;
top:50%;
transform:translate(-50%,-50%);
}

.orbit.one{
width:260px;
height:260px;
}

.orbit.two{
width:400px;
height:400px;
}

.orbit.three{
width:540px;
height:540px;
}

.moon{
position:absolute;
width:22px;
height:22px;
border-radius:50%;
background:#fff;
box-shadow:0 0 20px white;
left:50%;
top:50%;
animation:moonMove 6s linear infinite;
transform-origin:0 0;
}

@keyframes moonMove{
from{
transform:rotate(0deg) translateX(200px);
}
to{
transform:rotate(360deg) translateX(200px);
}
}

.space-star{
position:absolute;
width:4px;
height:4px;
background:white;
border-radius:50%;
box-shadow:0 0 15px white;
animation:twinkle 2s infinite alternate;
}

.space-star:nth-child(6){left:8%;top:25%}
.space-star:nth-child(7){right:10%;top:18%}
.space-star:nth-child(8){left:15%;bottom:18%}
.space-star:nth-child(9){right:18%;bottom:25%}

@keyframes twinkle{
to{
opacity:.15;
transform:scale(2);
}
}

.hero-bottom{
margin-top:55px;
font:700 13px "Space Grotesk",Arial,sans-serif;
letter-spacing:.4em;
color:var(--cyan);
}


/* =========================
ABOUT
========================= */

.about{
background:
linear-gradient(180deg,transparent,rgba(18,38,82,.2),transparent);
}

.about-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:60px;
margin-top:60px;
}

.about-card{
padding:35px;
border:1px solid var(--line);
border-radius:28px;
background:linear-gradient(145deg,rgba(10,20,42,.7),rgba(3,8,20,.5));
box-shadow:0 20px 80px rgba(0,0,0,.25);
transition:.4s;
}

.about-card:hover{
transform:translateY(-8px);
border-color:var(--line2);
box-shadow:0 25px 90px rgba(0,120,255,.12);
}

.about-card h3{
font:700 30px "Space Grotesk",Arial,sans-serif;
margin-bottom:18px;
}

.about-card p{
color:var(--muted);
line-height:1.9;
}


/* =========================
EXPLORE
========================= */

.explore-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:18px;
margin-top:60px;
}

.card{
position:relative;
min-height:330px;
padding:30px;
border:1px solid var(--line);
border-radius:26px;
background:
linear-gradient(145deg,rgba(10,20,42,.72),rgba(2,7,18,.7));
transition:transform .35s,border-color .35s,box-shadow .35s;
overflow:hidden;
}

.card:before{
content:"";
position:absolute;
width:150px;
height:150px;
right:-60px;
top:-60px;
background:var(--cyan);
filter:blur(70px);
opacity:.08;
}

.card:hover{
border-color:var(--line2);
box-shadow:0 25px 70px rgba(0,150,255,.13);
}

.icon{
font-size:38px;
margin-bottom:35px;
}

.card h3{
font:700 25px "Space Grotesk",Arial,sans-serif;
margin-bottom:15px;
}

.card p{
color:var(--muted);
line-height:1.7;
font-size:14px;
}

.tags{
display:flex;
flex-wrap:wrap;
gap:7px;
margin-top:25px;
}

.tag{
font-size:9px;
letter-spacing:.12em;
border:1px solid var(--line);
padding:7px 9px;
border-radius:999px;
color:#9fdfff;
}


/* =========================
MISSION
========================= */

.mission-box{
padding:60px;
border:1px solid var(--line2);
border-radius:35px;
background:
radial-gradient(circle at 80% 20%,rgba(60,100,255,.16),transparent 30%),
linear-gradient(145deg,rgba(10,22,50,.8),rgba(2,7,18,.8));
box-shadow:0 30px 100px rgba(0,0,0,.35);
}

.mission-box h2{
font:700 clamp(38px,6vw,75px)/1 "Space Grotesk",Arial,sans-serif;
max-width:900px;
letter-spacing:-.05em;
}

.mission-box p{
color:var(--muted);
line-height:1.9;
max-width:850px;
margin-top:28px;
}

.pipeline{
display:flex;
align-items:center;
justify-content:center;
flex-wrap:wrap;
gap:12px;
margin-top:50px;
}

.step{
padding:12px 16px;
border:1px solid var(--line2);
border-radius:999px;
font-size:10px;
font-weight:800;
letter-spacing:.12em;
color:var(--cyan);
background:rgba(0,20,40,.5);
}

.arrow{
color:#6681a8;
}


/* =========================
PROJECTS
========================= */

.project-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
margin-top:60px;
}

.project{
min-height:280px;
padding:30px;
border:1px solid var(--line);
border-radius:25px;
background:rgba(5,12,28,.65);
transition:.35s;
}

.project:hover{
transform:translateY(-7px);
border-color:var(--line2);
box-shadow:0 20px 60px rgba(0,130,255,.12);
}

.project .number{
font-size:10px;
letter-spacing:.25em;
color:var(--cyan);
}

.future{
float:right;
font-size:9px;
letter-spacing:.15em;
color:#7786a5;
border:1px solid var(--line);
padding:6px 8px;
border-radius:20px;
}

.project h3{
font:700 27px "Space Grotesk",Arial,sans-serif;
margin-top:60px;
margin-bottom:15px;
}

.project p{
color:var(--muted);
line-height:1.8;
font-size:14px;
}


/* =========================
PROCESS
========================= */

.process{
background:rgba(4,10,24,.6);
}

.process-list{
margin-top:60px;
border-top:1px solid var(--line);
}

.process-item{
display:grid;
grid-template-columns:150px 1fr 1fr;
gap:30px;
padding:35px 0;
border-bottom:1px solid var(--line);
align-items:center;
}

.process-item b{
font-size:11px;
letter-spacing:.2em;
color:var(--cyan);
}

.process-item h3{
font:700 27px "Space Grotesk",Arial,sans-serif;
}

.process-item p{
color:var(--muted);
line-height:1.7;
}


/* =========================
TERMINAL
========================= */

.terminal{
margin-top:55px;
border:1px solid rgba(125,255,196,.25);
border-radius:22px;
background:#02070b;
overflow:hidden;
box-shadow:0 30px 100px rgba(0,0,0,.45);
}

.terminal-top{
height:50px;
display:flex;
align-items:center;
gap:8px;
padding:0 18px;
border-bottom:1px solid rgba(125,255,196,.12);
}

.terminal-top i{
width:10px;
height:10px;
border-radius:50%;
background:#26334a;
}

.terminal-title{
margin-left:10px;
font:12px monospace;
color:#63718a;
}

.terminal-body{
padding:30px;
font:14px/2 monospace;
color:#c9ffe4;
}

.dim{
color:#62738e;
}

.ok{
color:var(--green);
}

.cursor{
display:inline-block;
width:8px;
height:15px;
background:var(--green);
vertical-align:middle;
animation:blink 1s steps(1) infinite;
}

@keyframes blink{
50%{opacity:0}
}


/* =========================
CONTACT
========================= */

.contact-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-top:60px;
}

.contact-card{
position:relative;
padding:45px;
border:1px solid var(--line);
border-radius:30px;
background:linear-gradient(145deg,rgba(8,18,38,.8),rgba(2,7,18,.75));
overflow:hidden;
}

.contact-head h3{
font:700 45px "Space Grotesk",Arial,sans-serif;
}

.contact-head p{
color:var(--muted);
line-height:1.8;
margin-top:12px;
}

.contact-orbit{
position:absolute;
right:-40px;
top:-40px;
width:180px;
height:180px;
border:1px solid var(--line2);
border-radius:50%;
animation:spin 10s linear infinite;
}

.contact-orbit:before{
content:"";
position:absolute;
width:10px;
height:10px;
background:var(--cyan);
border-radius:50%;
top:20px;
left:50%;
box-shadow:0 0 20px var(--cyan);
}

.contact-orbit span{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
color:var(--cyan);
}

@keyframes spin{
to{transform:rotate(360deg)}
}

.contact-links{
display:grid;
gap:12px;
margin-top:35px;
}

.contact-link{
display:grid;
grid-template-columns:45px 1fr 30px;
align-items:center;
gap:15px;
padding:16px;
border:1px solid var(--line);
border-radius:18px;
transition:.3s;
}

.contact-link:hover{
border-color:var(--line2);
transform:translateX(7px);
background:rgba(30,100,150,.08);
}

.contact-icon{
font-size:22px;
}

.contact-link small{
display:block;
font-size:8px;
letter-spacing:.2em;
color:var(--cyan);
margin-bottom:4px;
}

.contact-link b{
color:var(--cyan);
}

.join-card{
display:flex;
flex-direction:column;
justify-content:center;
}

.join-card h3{
font:700 clamp(38px,5vw,65px)/1 "Space Grotesk",Arial,sans-serif;
letter-spacing:-.05em;
}

.join-card h3 span{
color:var(--cyan);
}

.join-card p{
color:var(--muted);
line-height:1.8;
margin:25px 0;
max-width:500px;
}

.cta-status{
font-size:10px;
letter-spacing:.2em;
color:var(--green);
margin-bottom:25px;
}

.pulse-mini{
display:inline-block;
width:8px;
height:8px;
border-radius:50%;
background:var(--green);
box-shadow:0 0 15px var(--green);
animation:pulse 1.5s infinite;
}

.signal-bars{
display:flex;
gap:5px;
position:absolute;
bottom:25px;
right:30px;
align-items:end;
}

.signal-bars i{
display:block;
width:4px;
height:8px;
background:var(--cyan);
opacity:.5;
animation:signal 1.2s infinite alternate;
}

.signal-bars i:nth-child(2){height:15px;animation-delay:.1s}
.signal-bars i:nth-child(3){height:23px;animation-delay:.2s}
.signal-bars i:nth-child(4){height:13px;animation-delay:.3s}
.signal-bars i:nth-child(5){height:28px;animation-delay:.4s}
.signal-bars i:nth-child(6){height:18px;animation-delay:.5s}

@keyframes signal{
to{
opacity:1;
box-shadow:0 0 10px var(--cyan);
}
}


/* =========================
FOOTER
========================= */

footer{
border-top:1px solid var(--line);
padding:45px 0;
}

.footer-inner{
display:flex;
align-items:center;
justify-content:space-between;
}

.footer-mark{
font:800 25px "Space Grotesk",Arial,sans-serif;
letter-spacing:.1em;
}

.footer-copy{
font-size:11px;
line-height:1.8;
color:#71809c;
margin-top:8px;
}

.backtop{
width:45px;
height:45px;
display:grid;
place-items:center;
border:1px solid var(--line2);
border-radius:50%;
color:var(--cyan);
font-size:20px;
transition:.3s;
}

.backtop:hover{
transform:translateY(-5px);
background:rgba(99,230,255,.08);
}


/* =========================
REVEAL ANIMATIONS
========================= */

.reveal{
opacity:0;
transform:translateY(35px);
transition:opacity .9s ease,transform .9s ease;
}

.reveal.show{
opacity:1;
transform:none;
}

.stagger>*{
opacity:0;
transform:translateY(25px);
transition:opacity .7s ease,transform .7s ease;
}

.stagger.show>*{
opacity:1;
transform:none;
}

.stagger.show>*:nth-child(2){transition-delay:.08s}
.stagger.show>*:nth-child(3){transition-delay:.16s}
.stagger.show>*:nth-child(4){transition-delay:.24s}
.stagger.show>*:nth-child(5){transition-delay:.32s}
